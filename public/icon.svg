<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" floodColor="#0f172a" floodOpacity="0.3" />
    </filter>
  </defs>

  <!-- Samsung One UI Squircle Background with Blue Gradient -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Inner White Circular Tray Plate -->
  <circle cx="256" cy="256" r="180" fill="url(#trayGrad)" stroke="#cbd5e1" stroke-width="6" filter="url(#shadow)"/>

  <!-- Dashed Radial Axes -->
  <line x1="256" y1="256" x2="256" y2="76" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6"/>
  <line x1="256" y1="256" x2="100" y2="346" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6"/>
  <line x1="256" y1="256" x2="412" y2="346" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- Concentric Rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#34d399" stroke-width="8" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#38bdf8" stroke-width="7" stroke-dasharray="12 8"/>

  <!-- Center Rose Hub -->
  <circle cx="256" cy="256" r="24" fill="#e11d48" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- 3 Drill Heads on White Badge Circles -->
  <!-- Head 1 (Top) -->
  <g transform="translate(256, 76)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
    <polygon points="0,-12 -9,8 9,8" fill="#06b6d4" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Head 2 (Bottom-Left) -->
  <g transform="translate(118, 335)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
    <polygon points="0,-12 -9,8 9,8" fill="#f97316" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Head 3 (Bottom-Right) -->
  <g transform="translate(394, 335)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
    <polygon points="0,-12 -9,8 9,8" fill="#10b981" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
